name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: skip
      DENO_DIR: .deno-cache

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tsx
        run: npm install -g tsx

      - name: Run all tests
        run: |
          for f in tests/*.test.ts; do
            echo "::group::$f"
            npx tsx --test "$f"
            echo "::endgroup::"
          done
